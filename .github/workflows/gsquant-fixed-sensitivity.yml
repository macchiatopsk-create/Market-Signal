name: gsquant-fixed-sensitivity
on:
  push:
    paths:
      - "gsquant_fixed_sensitivity.py"
      - ".github/workflows/gsquant-fixed-sensitivity.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install gs-quant
      - name: run sensitivity sweep
        run: python gsquant_fixed_sensitivity.py
      - name: persist result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash || true
          git add gsquant_fixed_sensitivity_result.json
          git commit -m "GS Quant fixed sensitivity $(date -u +%F_%H%M)" || echo none
          git push || echo skip
