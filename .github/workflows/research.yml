name: research
on:
  workflow_dispatch:
    inputs:
      target:
        description: "실행할 스크립트 (all / v7 / v9 / v10 / vixts / premarket / credit / gapfill)"
        default: "all"
  push:
    paths:
      - "gapafter.py"
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - name: run selected
        run: |
          T="${{ github.event.inputs.target }}"
          if [ -z "$T" ]; then T="gapafter"; fi
          run_one() { echo "== $1 =="; python "$1" || echo "FAIL $1"; }
          case "$T" in
            v7)        run_one v7_backtest.py ;;
            v9)        run_one v9_test.py ;;
            v10)       run_one v10_test.py ;;
            vixts)     run_one vixts_test.py; run_one vixts_confirm.py; run_one vixts_range.py ;;
            premarket) run_one premarket_test.py ;;
            credit)    run_one credit_test.py ;;
            gapfill)   run_one gapfill_test.py ;;
            gappath)   run_one gappath_test.py ;;
            gapsweep)  run_one gapsweep_test.py ;;
            futures)   run_one futures_test.py ;;
            gapdir)    run_one gapdir_test.py ;;
            gapcont)   run_one gapcont_test.py ;;
            gapvwap)   run_one gapvwap_test.py ;;
            gapvix)    run_one gapvix_test.py ;;
            gapvixchg) run_one gapvixchg_test.py ;;
            gapvixopen) run_one gapvixopen_test.py ;;
            gapcover)  run_one gapcover_test.py ;;
            gapdays)   run_one gapdays_test.py ;;
            gapprog)   run_one gapprog_test.py ;;
            gapentry)  run_one gapentry_test.py ;;
            gaplist)   run_one gaplist.py ;;
            gapopt)    run_one gapopt_test.py ;;
            todaylike) run_one todaylike.py ;;
            macroprobe) run_one macroprobe.py ;;
            macromatch) run_one macromatch.py ;;
            augmatch)  run_one augmatch.py ;;
            killswitch) run_one killswitch.py ;;
            single)    run_one single.py ;;
            symmetric) run_one symmetric.py ;;
            vixrate)   run_one vixrate.py ;;
            qqqvix)    run_one qqqvix.py ;;
            gapafter)  run_one gapafter.py ;;
            gapfull)   run_one gapfull.py ;;
            covthresh) run_one covthresh.py ;;
            covexec)   run_one covexec.py ;;
            baserate)  run_one baserate.py ;;
            basesweep) run_one basesweep.py ;;
            exitres)   run_one exitres.py ;;
            trailsweep) run_one trailsweep.py ;;
            minres)    run_one minres.py ;;
            minres2)   run_one minres2.py ;;
            pollsim)   run_one pollsim.py ;;
            orbvwap)   run_one orbvwap.py ;;
            orbtrail)  run_one orbtrail.py ;;
            orbc)      run_one orbc.py ;;
            orbvix)    run_one orbvix.py ;;
            qqqnight)  run_one qqqnight.py ;;
            combsim)   run_one combsim.py ;;
            gsbt)      run_one gsbt.py ;;
            gs2)       run_one gs2.py ;;
            vbsweep)   run_one vbsweep.py ;;
            recheck)   run_one combsim.py ; run_one orbvix.py ; run_one vbsweep.py ; run_one minres2.py ;;
            ideatest)  run_one ideatest.py ;;
            srcprobe)  run_one srcprobe.py ;;
            dukasval)  run_one dukasval.py ;;
            dukasfill) run_one dukasfill.py ;;
            gapfill1m) run_one gapfill1m.py ;;
            tvprobe)   run_one tvprobe.py ;;
            entry3)    run_one entry3.py ;;
            sizing)    run_one sizing.py ;;
            worstdays) run_one worstdays.py ;;
            timecut)   run_one timecut.py ;;
            l3size)    run_one l3size.py ;;
            gappull)   run_one gappull_test.py ;;
            all)       for f in v9_test.py v10_test.py v7_backtest.py; do run_one $f; done ;;
          esac
      - name: persist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash || true
          git add *_result.json *_confirm.json *_range.json 2>/dev/null || true
          git add -A data 2>/dev/null || true
          git commit -m "research $(date -u +%F_%H%M)" || echo none
          git push || echo skip
